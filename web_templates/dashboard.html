{% extends "base.html" %}

{% block title %}仪表板 - CapsWriter-Offline 网页版{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2 class="mb-4">
            <i class="fas fa-tachometer-alt me-2"></i>系统仪表板
        </h2>
    </div>
</div>

<!-- 系统状态卡片 -->
<div class="row mb-4">
    <div class="col-lg-3 col-md-6 mb-3">
        <div class="card bg-primary text-white">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h6 class="card-title">服务端状态</h6>
                        <h4 id="server-status-text">检查中...</h4>
                    </div>
                    <div class="align-self-center">
                        <i class="fas fa-server fa-2x"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-lg-3 col-md-6 mb-3">
        <div class="card bg-success text-white">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h6 class="card-title">客户端状态</h6>
                        <h4 id="client-status-text">检查中...</h4>
                    </div>
                    <div class="align-self-center">
                        <i class="fas fa-desktop fa-2x"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-lg-3 col-md-6 mb-3">
        <div class="card bg-info text-white">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h6 class="card-title">AI服务状态</h6>
                        <h4 id="agent-status-text">检查中...</h4>
                    </div>
                    <div class="align-self-center">
                        <i class="fas fa-robot fa-2x"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-lg-3 col-md-6 mb-3">
        <div class="card bg-warning text-white">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h6 class="card-title">系统负载</h6>
                        <h4 id="system-load">正常</h4>
                    </div>
                    <div class="align-self-center">
                        <i class="fas fa-chart-line fa-2x"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 系统控制面板 -->
<div class="row mb-4">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">
                    <i class="fas fa-cogs me-2"></i>系统控制
                </h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <h6>服务控制</h6>
                        <div class="btn-group mb-3" role="group">
                            <button id="start-server-btn" class="btn btn-success">
                                <i class="fas fa-play me-1"></i>启动服务端
                            </button>
                            <button id="start-client-btn" class="btn btn-info">
                                <i class="fas fa-play me-1"></i>启动客户端
                            </button>
                            <button id="start-all-btn" class="btn btn-primary">
                                <i class="fas fa-play me-1"></i>启动全部
                            </button>
                        </div>
                        <div class="btn-group" role="group">
                            <button id="stop-all-btn" class="btn btn-danger">
                                <i class="fas fa-stop me-1"></i>停止全部
                            </button>
                            <button id="restart-all-btn" class="btn btn-warning">
                                <i class="fas fa-redo me-1"></i>重启全部
                            </button>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <h6>快速操作</h6>
                        <div class="d-flex flex-wrap gap-2">
                            <button class="btn btn-outline-primary btn-sm" onclick="window.open('/transcription')">
                                <i class="fas fa-microphone me-1"></i>语音转录
                            </button>
                            <button class="btn btn-outline-success btn-sm" onclick="window.open('/text_processing')">
                                <i class="fas fa-edit me-1"></i>文本处理
                            </button>
                            <button class="btn btn-outline-info btn-sm" onclick="window.open('/translation')">
                                <i class="fas fa-language me-1"></i>翻译
                            </button>
                            <button class="btn btn-outline-secondary btn-sm" onclick="window.open('/config')">
                                <i class="fas fa-cog me-1"></i>配置
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 实时日志和进程信息 -->
<div class="row">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="card-title mb-0">
                    <i class="fas fa-list-alt me-2"></i>系统日志
                </h5>
                <div>
                    <button id="clear-log-btn" class="btn btn-sm btn-outline-secondary">
                        <i class="fas fa-trash me-1"></i>清空
                    </button>
                    <button id="refresh-log-btn" class="btn btn-sm btn-outline-primary">
                        <i class="fas fa-sync me-1"></i>刷新
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div id="system-log" class="bg-dark text-light p-3 rounded" style="height: 400px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 0.9em;">
                    <div class="text-muted">等待日志信息...</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-lg-4">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">
                    <i class="fas fa-tasks me-2"></i>运行进程
                </h5>
            </div>
            <div class="card-body">
                <div id="process-list">
                    <div class="text-muted">加载进程信息...</div>
                </div>
            </div>
        </div>
        
        <div class="card mt-3">
            <div class="card-header">
                <h5 class="card-title mb-0">
                    <i class="fas fa-info-circle me-2"></i>系统信息
                </h5>
            </div>
            <div class="card-body">
                <div id="system-info">
                    <div class="mb-2">
                        <strong>最后更新:</strong>
                        <span id="last-update">-</span>
                    </div>
                    <div class="mb-2">
                        <strong>运行时间:</strong>
                        <span id="uptime">-</span>
                    </div>
                    <div class="mb-2">
                        <strong>网页版本:</strong>
                        <span class="badge bg-primary">v1.0.0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let socket;
let startTime = new Date();

// 页面加载完成后初始化
document.addEventListener('DOMContentLoaded', function() {
    // 初始化Socket.IO连接
    initializeSocket();
    
    // 更新系统状态
    updateSystemStatus();
    
    // 设置定时更新
    setInterval(updateSystemStatus, 3000);
    setInterval(updateUptime, 1000);
    
    // 绑定按钮事件
    bindControlButtons();
    
    // 初始化日志
    addLogEntry('系统仪表板已加载', 'info');
});

// 初始化Socket.IO连接
function initializeSocket() {
    socket = io();
    
    socket.on('connect', function() {
        addLogEntry('WebSocket连接已建立', 'success');
    });
    
    socket.on('disconnect', function() {
        addLogEntry('WebSocket连接已断开', 'warning');
    });
    
    socket.on('system_status', function(data) {
        addLogEntry(`系统状态: ${data.message}`, 'info');
    });
}

// 绑定控制按钮事件
function bindControlButtons() {
    document.getElementById('start-server-btn').addEventListener('click', () => {
        controlSystem('start', { server_only: true });
    });
    
    document.getElementById('start-client-btn').addEventListener('click', () => {
        controlSystem('start', { client_only: true });
    });
    
    document.getElementById('start-all-btn').addEventListener('click', () => {
        controlSystem('start', { background: true });
    });
    
    document.getElementById('stop-all-btn').addEventListener('click', () => {
        controlSystem('stop');
    });
    
    document.getElementById('restart-all-btn').addEventListener('click', () => {
        controlSystem('restart');
    });
    
    document.getElementById('clear-log-btn').addEventListener('click', () => {
        document.getElementById('system-log').innerHTML = '';
        addLogEntry('日志已清空', 'info');
    });
    
    document.getElementById('refresh-log-btn').addEventListener('click', () => {
        updateSystemStatus();
        addLogEntry('状态已刷新', 'info');
    });
}

// 更新系统状态
function updateSystemStatus() {
    fetch('/api/system/status')
        .then(response => response.json())
        .then(data => {
            // 更新状态卡片
            updateStatusCard('server-status-text', data.server_running, '运行中', '已停止');
            updateStatusCard('client-status-text', data.client_running, '运行中', '已停止');
            updateStatusCard('agent-status-text', data.agent_service_running, '运行中', '已停止');
            
            // 更新进程列表
            updateProcessList(data.processes);
            
            // 更新最后更新时间
            document.getElementById('last-update').textContent = new Date().toLocaleTimeString();
        })
        .catch(error => {
            console.error('获取系统状态失败:', error);
            addLogEntry('获取系统状态失败: ' + error.message, 'error');
        });
}

// 更新状态卡片
function updateStatusCard(elementId, isRunning, runningText, stoppedText) {
    const element = document.getElementById(elementId);
    element.textContent = isRunning ? runningText : stoppedText;
    element.parentElement.parentElement.parentElement.className = 
        `card ${isRunning ? 'bg-success' : 'bg-secondary'} text-white`;
}

// 更新进程列表
function updateProcessList(processes) {
    const container = document.getElementById('process-list');
    if (!processes || Object.keys(processes).length === 0) {
        container.innerHTML = '<div class="text-muted">暂无运行进程</div>';
        return;
    }
    
    let html = '';
    for (const [name, info] of Object.entries(processes)) {
        html += `
            <div class="d-flex justify-content-between align-items-center mb-2 p-2 bg-light rounded">
                <div>
                    <strong>${name}</strong><br>
                    <small class="text-muted">PID: ${info.pid || 'N/A'}</small>
                </div>
                <span class="badge bg-success">运行中</span>
            </div>
        `;
    }
    container.innerHTML = html;
}

// 控制系统
function controlSystem(action, options = {}) {
    const data = { ...options };
    
    let url = '/api/system/' + action;
    if (action === 'restart') {
        addLogEntry('正在重启系统...', 'info');
        // 先停止再启动
        fetch('/api/system/stop', { method: 'POST' })
            .then(() => {
                addLogEntry('系统已停止，正在启动...', 'info');
                setTimeout(() => {
                    fetch('/api/system/start', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ background: true })
                    })
                    .then(response => response.json())
                    .then(data => {
                        addLogEntry(data.message, data.success ? 'success' : 'error');
                        updateSystemStatus();
                    });
                }, 2000);
            });
        return;
    }
    
    addLogEntry(`正在执行: ${action}`, 'info');
    
    fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(data => {
        addLogEntry(data.message, data.success ? 'success' : 'error');
        updateSystemStatus();
    })
    .catch(error => {
        addLogEntry('操作失败: ' + error.message, 'error');
    });
}

// 添加日志条目
function addLogEntry(message, type = 'info') {
    const logContainer = document.getElementById('system-log');
    const timestamp = new Date().toLocaleTimeString();
    
    const colors = {
        'info': '#17a2b8',
        'success': '#28a745',
        'warning': '#ffc107',
        'error': '#dc3545'
    };
    
    const entry = document.createElement('div');
    entry.innerHTML = `
        <span class="text-muted">[${timestamp}]</span>
        <span style="color: ${colors[type] || colors.info}">${message}</span>
    `;
    
    logContainer.appendChild(entry);
    logContainer.scrollTop = logContainer.scrollHeight;
    
    // 限制日志条目数量
    const entries = logContainer.children;
    if (entries.length > 100) {
        logContainer.removeChild(entries[0]);
    }
}

// 更新运行时间
function updateUptime() {
    const now = new Date();
    const diff = now - startTime;
    const hours = Math.floor(diff / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((diff % (1000 * 60)) / 1000);
    
    document.getElementById('uptime').textContent = 
        `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
}
</script>
{% endblock %}
